<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F5F7FA" />
    <meta name="description" content="ApexCoach — training, nutrition, and habit coaching for trainers, clients, and solo athletes." />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ApexCoach" />
    <title>ApexCoach</title>
    <!-- Serve Excalidraw's fonts/chunks from our own origin instead of the
         unpkg.com CDN. Keeps the notebook whiteboard working offline and
         stops third-party JS executing in a page that renders PHI. -->
    <script>window.EXCALIDRAW_ASSET_PATH = "/";</script>
    <!-- Apply the saved theme before first paint so dark-mode users never see
         a white flash while the bundle loads. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("apex_theme") || "light";
          var dark = t === "dark" || (t === "system" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) {
            document.documentElement.classList.add("dark");
            document.querySelector('meta[name="theme-color"]')
              .setAttribute("content", "#0A0C10");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
